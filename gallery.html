<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Галерея</title>
     <style>
        h1 {
            text-align: center;
            font-size: 20px;
        }

        .back-link {
            font-style: italic;
        }

        h2 {
            text-align: center;
            font-size: 24px;
        }

        h3 {
            text-align: center;
        }

        .h3-smaller {
            font-size: 70%;   /* 24 * 0.7 = 16.8px */
        }

        .h3-bigger {
            font-size: 130%;  /* 24 * 1.3 = 31.2px */
        }

        .h3-biggest {
            font-size: 169%;  /* 130% * 1.3 ≈ 169% → 40.56px */
        }

        img {
            display: block;
            margin: 10px auto;
        }
    </style>
</head>
<body>

    <h1>Галерея ЯШІ</h1>

    <a href="index.html" class="back-link">Назад на головну</a>

    <h2>Мої зображення</h2>

    <h3 class="h3-smaller">Зображення у цій папці</h3>
    <img src="image1.png" alt="Зображення 1" width="600" height="400">

    <h3 class="h3-bigger">Зображення у папці</h3>
    <img src="images/image2.png" alt="Зображення 2" width="640" height="480">

    <h3 class="h3-biggest">Зображення онлайн</h3>
    <img src="https://placehold.co/1280x1024" alt="Онлайн зображення" width="1280" height="1024">

</body>
</html>
